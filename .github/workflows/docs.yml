# Builds the UUID detail reference (docs/dist/index.html, from
# scripts/generate-uuid-details.mjs) on master pushes that change the library
# or the page, and deploys it to GitHub Pages through the org's
# reusable-docs-publish workflow in `pages` mode (the GitHub Pages actions; no
# gh-pages branch or bot secrets). From the CLDMV/.github
# packaging-docs/docs.yml template.
#
# Requires the repo's Pages source to be "GitHub Actions"
# (Settings → Pages → Build and deployment).
name: 📖 Publish Docs

on:
    push:
        branches: [master]
        paths:
            - "src/**"
            - "scripts/generate-uuid-details.mjs"
            - "scripts/uuid-details.template.html"
            - "package.json"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: CLDMV/.github/.github/workflows/reusable-docs-publish.yml@v4
        with:
            deploy_mode: "pages"
            build_command: "npm run docs:build"
            output_dir: "docs/dist"
