<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>UUID Detail Reference · @cldmv/uuid</title>
		<meta
			name="description"
			content="What every @cldmv/uuid detail method returns for each RFC version, the Nil, Max and Microsoft ids, and each kind of CLDMV id."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
		/>
		<style>
			/* Generated by `npm run docs:build` (scripts/generate-uuid-details.mjs) from this template. */
			/* Layout: one column of id cards; each card is a header (what the id is) and a wrapping key/value grid. Tabs pick the method; nothing scrolls sideways. */
			:root {
				color-scheme: light;
				--bg: #f4f6f8;
				--surface: #ffffff;
				--fg: #18202b;
				--muted: #5d6877;
				--line: #dce1e8;
				--accent: #1f6f8b;
				--accent-fg: #ffffff;
				--rfc: #3f55b8;
				--rfc-soft: #e6e9f8;
				--cldmv: #1f6f8b;
				--cldmv-soft: #e2eff4;
				--other: #8a5a00;
				--other-soft: #fbefd5;
				--display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
				--body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
				--mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color-scheme: dark;
					--bg: #10151c;
					--surface: #18202a;
					--fg: #e5eaf1;
					--muted: #9aa5b4;
					--line: #2a3542;
					--accent: #5fb3cf;
					--accent-fg: #0d1a20;
					--rfc: #a4b2f5;
					--rfc-soft: #222a4a;
					--cldmv: #6cc0dc;
					--cldmv-soft: #173341;
					--other: #f0c05a;
					--other-soft: #352a12;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--fg);
				font-family: var(--body);
				font-size: 15px;
				line-height: 1.5;
			}
			.wrap {
				max-width: 980px;
				margin: 0 auto;
				padding-block: 24px 64px;
				padding-left: max(16px, env(safe-area-inset-left, 0px));
				padding-right: max(16px, env(safe-area-inset-right, 0px));
				display: grid;
				gap: 20px;
			}
			h1,
			h2 {
				font-family: var(--display);
				margin: 0;
				text-wrap: balance;
			}
			h1 {
				font-size: 1.7rem;
				letter-spacing: -0.01em;
			}
			p {
				margin: 6px 0 0;
				max-width: 68ch;
			}
			a {
				color: var(--accent);
			}
			code {
				font-family: var(--mono);
				font-size: 0.88em;
			}
			.eyebrow {
				font: 0.72rem var(--mono);
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--muted);
			}
			details.notes {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 12px 14px;
			}
			details.notes summary {
				cursor: pointer;
				font-weight: 600;
			}
			details.notes ul {
				margin: 10px 0 0;
				padding-left: 18px;
				display: grid;
				gap: 6px;
				font-size: 0.92rem;
			}
			.bar {
				position: sticky;
				top: 0;
				z-index: 5;
				background: var(--bg);
				padding-top: max(8px, env(safe-area-inset-top, 0px));
				padding-bottom: 8px;
				display: grid;
				gap: 8px;
				border-bottom: 1px solid var(--line);
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.chip {
				font: 500 0.82rem var(--body);
				border: 1px solid var(--line);
				background: var(--surface);
				color: var(--fg);
				padding: 6px 11px;
				border-radius: 999px;
				cursor: pointer;
			}
			.chip[aria-pressed="true"] {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--accent-fg);
			}
			.chip.small {
				font-size: 0.76rem;
				padding: 4px 10px;
			}
			.chip:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.note {
				color: var(--muted);
				font-size: 0.88rem;
			}
			.cards {
				display: grid;
				gap: 12px;
			}
			.card {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 10px;
				overflow: hidden;
				min-width: 0;
			}
			.card header {
				padding: 10px 12px;
				border-bottom: 1px solid var(--line);
				display: grid;
				gap: 2px;
			}
			.title {
				display: flex;
				gap: 8px;
				align-items: center;
				flex-wrap: wrap;
				font-weight: 600;
			}
			.fam {
				font: 600 0.66rem var(--mono);
				padding: 1px 6px;
				border-radius: 4px;
			}
			.fam.rfc {
				background: var(--rfc-soft);
				color: var(--rfc);
			}
			.fam.cldmv {
				background: var(--cldmv-soft);
				color: var(--cldmv);
			}
			.fam.other {
				background: var(--other-soft);
				color: var(--other);
			}
			.uuid {
				font: 0.82rem var(--mono);
				overflow-wrap: anywhere;
			}
			.made {
				font-size: 0.8rem;
				color: var(--muted);
				overflow-wrap: anywhere;
			}
			dl {
				margin: 0;
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
			}
			dl > div {
				padding: 8px 12px;
				border-bottom: 1px solid var(--line);
				border-right: 1px solid var(--line);
				min-width: 0;
			}
			dl > div.wide {
				grid-column: 1 / -1;
			}
			dt {
				font-size: 0.72rem;
				color: var(--muted);
				overflow-wrap: anywhere;
			}
			dd {
				margin: 0;
				font: 0.86rem var(--mono);
				overflow-wrap: anywhere;
				white-space: pre-wrap;
				font-variant-numeric: tabular-nums;
			}
			dd.null {
				color: var(--muted);
			}
			ol.order {
				margin: 0;
				padding: 0;
				list-style: none;
				display: grid;
				gap: 6px;
				counter-reset: n;
			}
			ol.order li {
				counter-increment: n;
				display: grid;
				grid-template-columns: 2.2em 1fr;
				gap: 4px 8px;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 8px 10px;
			}
			ol.order li::before {
				content: counter(n);
				font: 600 0.8rem var(--mono);
				color: var(--muted);
				grid-row: span 2;
			}
			ol.order .when {
				font: 0.78rem var(--mono);
				color: var(--muted);
			}
			footer {
				color: var(--muted);
				font-size: 0.85rem;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<div class="eyebrow">@cldmv/uuid v__VERSION__</div>
				<h1>UUID Detail Reference</h1>
				<p>__INTRO__</p>
			</header>

			<details class="notes">
				<summary>Reading the fields</summary>
				<ul>
					__NOTES__
				</ul>
			</details>

			<div class="bar">
				<div class="row" role="group" aria-label="Method" id="tabs"></div>
				<div class="row" role="group" aria-label="Which ids">
					<button class="chip small" id="f-all" data-f="all" aria-pressed="true">All ids</button>
					<button class="chip small" id="f-rfc" data-f="rfc" aria-pressed="false">RFC</button>
					<button class="chip small" id="f-cldmv" data-f="cldmv" aria-pressed="false">CLDMV</button>
					<button class="chip small" id="f-other" data-f="other" aria-pressed="false">Other</button>
				</div>
			</div>

			<p class="note" id="tabnote"></p>
			<div class="cards" id="cards"></div>

			<footer>
				Generated from the library by <code>npm run docs:build</code>. The same reference as Markdown:
				<a href="https://github.com/CLDMV/uuid/blob/master/docs/reference/uuid-details.md">docs/reference/uuid-details.md</a>.
				<a href="https://github.com/CLDMV/uuid">CLDMV/uuid on GitHub</a>.
			</footer>
		</div>

		<script id="data" type="application/json">
			__DATA__
		</script>
		<script>
			const DATA = JSON.parse(document.getElementById("data").textContent);
			const COMPARE = "UUID.compare order";
			const TABS = [...DATA.tabs, COMPARE];
			const NOTES = {
				"getInfo()":
					"One shape for every id. variant is the family number; fullVersion is variant.subvariant.version; timestamp is on the Unix epoch in timestampUnit.",
				"Instance methods":
					"Called on new UUID(id). getVariant, getSubvariant and getVersion read their raw bit positions on any id, so an RFC id reads variant 4 or 5 here.",
				"Static methods": "Called with the id string.",
				"await UUID.validate(id)": "The getInfo() fields (timestamp as a bigint) plus the raw timestamp bit fields.",
				"await UUID.validateDetailed(id)": "Bit fields, entropy and warnings.",
				[COMPARE]: "__COMPARE_NOTE__"
			};
			const kind = (o) => (o.family === "CLDMV" ? "cldmv" : o.family === "RFC 4122/9562" ? "rfc" : "other");
			const famName = (o) => (o.family === "RFC 4122/9562" ? "RFC" : o.family);
			let tab = 0;
			let filter = "all";
			try {
				const saved = Number(localStorage.getItem("uuid-details-tab"));
				if (Number.isInteger(saved) && saved >= 0 && saved < TABS.length) tab = saved;
			} catch {}
			const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
			const badge = (o) => `<span class="fam ${kind(o)}">${esc(famName(o))}</span>`;
			function grid(rows) {
				return (
					"<dl>" +
					rows
						.map(([key, value]) => {
							const wide = value.startsWith("[") && value.length > 2;
							const shown = wide ? JSON.parse(value).join("\n") : value;
							return `<div${wide ? ' class="wide"' : ""}><dt>${esc(key)}</dt><dd${value === "null" ? ' class="null"' : ""}>${esc(shown)}</dd></div>`;
						})
						.join("") +
					"</dl>"
				);
			}
			function render() {
				document.getElementById("tabs").innerHTML = TABS.map(
					(name, i) => `<button class="chip" data-tab="${i}" aria-pressed="${i === tab}">${esc(name)}</button>`
				).join("");
				document.getElementById("tabnote").innerHTML = NOTES[TABS[tab]].replace(/`([^`]+)`/g, "<code>$1</code>");
				const keep = (o) => filter === "all" || kind(o) === filter;
				const cards = document.getElementById("cards");
				if (TABS[tab] === COMPARE) {
					const items = DATA.order.map(({ label, date }) => ({ ...DATA.ids.find((x) => x.label === label), date })).filter(keep);
					cards.innerHTML = `<ol class="order">${items.map((o) => `<li><div class="title">${badge(o)}${esc(o.label)}</div><div class="when">${esc(o.date || "no timestamp")}</div></li>`).join("")}</ol>`;
				} else {
					cards.innerHTML = DATA.ids
						.filter(keep)
						.map(
							(o) =>
								`<article class="card"><header><div class="title">${badge(o)}${esc(o.label)}</div><div class="uuid">${esc(o.id)}</div><div class="made">Made with <code>${esc(o.made)}</code></div></header>${grid(o.sections[tab])}</article>`
						)
						.join("");
				}
				document.querySelectorAll("#tabs .chip").forEach((b) =>
					b.addEventListener("click", () => {
						tab = Number(b.dataset.tab);
						try {
							localStorage.setItem("uuid-details-tab", String(tab));
						} catch {}
						render();
					})
				);
			}
			document.querySelectorAll("[data-f]").forEach((b) =>
				b.addEventListener("click", () => {
					filter = b.dataset.f;
					document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
					render();
				})
			);
			render();
		</script>
	</body>
</html>
